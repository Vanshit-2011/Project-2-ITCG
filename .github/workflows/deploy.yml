name: Deploy Node.js App to EC2

on:
  push:
    branches:
      - main
      - qa

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: itcg-project-2

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }} \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            .

      # 5. Push Docker image to ECR
      - name: Push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # 6. Deploy image to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          AWS_REGION: ${{ env.AWS_REGION }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_REGISTRY,ECR_REPOSITORY,IMAGE_TAG,AWS_REGION
          script: |
            
            set -e

            echo "================================"
            echo "Starting deployment"
            echo "================================"

            echo "Logging in to ECR..."

            aws ecr get-login-password \
              --region $AWS_REGION | \
              docker login \
              --username AWS \
              --password-stdin $ECR_REGISTRY

            echo "Pulling new Docker image..."

            docker pull \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Stopping old container..."

            docker stop node-app || true

            echo "Removing old container..."

            docker rm node-app || true

            echo "Starting new container..."

            docker run -d \
              --name node-app \
              --restart unless-stopped \
              -p 3000:3000 \
              -e ENV=DEV \
              $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

            echo "Checking container status..."

            docker ps

            echo "Checking application..."

            sleep 5

            curl -f http://localhost:3000

            echo "================================"
            echo "Deployment successful"
            echo "================================"

   # =========================
  # QA DEPLOYMENT
  # =========================
  deploy-qa:
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to QA
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.QA_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.QA_EC2_SSH_KEY }}

          script: |
            set -e

            echo "Deploying to QA..."

            cd /home/ec2-user/node-cicd-demo/aws-ec2-cicd

            git fetch origin qa
            git reset --hard origin/qa
            git clean -fd

            echo "2. Checking deployed commit..."
            git rev-parse HEAD
            git log -1 --oneline

            echo "3. Installing dependencies..."
            npm install

            echo "4. Restarting PM2 application..."

            if pm2 describe node-cicd-demo > /dev/null 2>&1; then
                APP_ENV=QA pm2 restart node-cicd-demo --update-env
            else
                APP_ENV=QA pm2 start node-cicd-demo --update-env
            fi


            echo "QA deployment successful!"


  # =========================
  # PROD DEPLOYMENT
  # =========================
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to PROD
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.PROD_EC2_SSH_KEY }}

          script: |
            set -e

            echo "Deploying to PROD..."

            cd /home/ec2-user/node-cicd-demo/aws-ec2-cicd

            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            echo "2. Checking deployed commit..."
            git rev-parse HEAD
            git log -1 --oneline

            echo "3. Installing dependencies..."
            npm install

            echo "4. Restarting PM2 application..."

            if pm2 describe node-cicd-demo > /dev/null 2>&1; then
                APP_ENV=PROD pm2 restart node-cicd-demo --update-env
            else
                APP_ENV=PROD pm2 start node-cicd-demo --update-env
            fi

             echo "QA Deployment Succesfully"
    


